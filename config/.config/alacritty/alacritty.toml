[general]
# import = ["rose-pine.toml"]
import = ["kitty.toml"]

[window]
dimensions = { columns = 100, lines = 25 }
padding = { x = 3, y = 0 }
opacity = 0.9
blur = false

[scrolling]
history = 10000
multiplier = 3

[font]
size = 11
normal = { family = "Monaspace Krypton", style = "Medium"}
bold = { family = "Monaspace Krypton", style = "Bold"}
italic = { family = "Monaspace Krypton", style = "Medium Italic"}
bold_italic = { family = "Monaspace Krypton", style = "Bold Italic"}

[colors.primary]
background = "#000000"

[cursor]
style = {blinking = "On"}
unfocused_hollow = true

[mouse]
hide_when_typing = true
