format = """
$os(color_bg1)\
$username\
[](fg:color_bg1 bg:color_bg2)\
$directory\
[](fg:color_bg2 bg:color_bg3)\
$git_branch\
[](fg:color_bg3 bg:color_bg4)\
$git_status\
$git_metrics\
[](color_bg4)\
$fill\
$cmd_duration $jobs\
[ ](color_bg1)\
$rust\
$cmake\
$zig\
$cpp\
$line_break\
$character"""

palette = 'rose_pine'

[palettes.rose_pine]
color_fg = '#e0def4'
color_bg1 = '#191724'
color_bg2 = '#2a273f'
color_bg3 = '#393552'
color_bg4 = '#56526e'
color_red = '#eb6f92'
color_gold = '#f6c177'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[ᗙ](bold fg:color_fg)'
error_symbol = '[ᗙ](bold fg:color_red)'

[os]
disabled = false
style = "bg:color_bg1 fg:color_fg"

[os.symbols]
CachyOS = "󰣇"

[username]
show_always = true
style_user = "bg:color_bg1 fg:color_fg"
style_root = "bg:color_bg1 fg:color_fg"
format = '[ $user ]($style)'

[directory]
style = "fg:color_fg bg:color_bg2"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "fg:color_fg bg:color_bg3"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "fg:color_fg bold bg:color_bg4"
format = '[( $all_status$ahead_behind )]($style)'

[git_metrics]
disabled = false
added_style = "fg:color_gold bold bg:color_bg4"
deleted_style = "fg:color_red bold bg:color_bg4"
format = '[[([+$added]($added_style) )([-$deleted]($deleted_style) )](bg:color_bg4)]($style)'

[fill]
symbol = " "

[jobs]
symbol = ""
style = "bold red"
number_threshold = 1
format = "[$symbol]($style)"

[rust]
symbol = ""
style = "fg:bold red bg:color_bg1"
format = '[ $symbol( $version) ]($style)'

[cmake]
symbol = ""
style = "fg:bold blue bg:color_bg1"
format = '[ $symbol( $version) ]($style)'

[cpp]
symbol = ""
style = "fg:bold 149 bg:color_bg1"
format = '[ $symbol( $version) ]($style)'

[zig]
symbol = ""
style = "fg:bold yellow bg:color_bg1"
format = '[ $symbol( $version) ]($style)'
