initial-window-size-chars = 100x25
pad=3x0

font=Iosevka:size=11:style=Medium Extended
font-bold=Iosevka:size=11:style=Bold Extended
font-italic=Iosevka:size=11:style=Medium Extended Italic
font-bold-italic=Iosevka:size=11:style=Bold Extended Italic

# font=Monaspace Krypton:size=11:style=Medium
# font-bold=Monaspace Krypton:size=11:style=Bold
# font-italic=Monaspace Krypton:size=11:style=Medium Italic
# font-bold-italic=Monaspace Krypton:size=11:style=Bold Italic
line-height=14

[cursor]
style=block
unfocused-style=hollow
blink=yes

[scrollback]
lines=3000
multiplier=3.0

[colors]
alpha=0.9
background=000000
foreground=ffffff
cursor= 000000 ffffff
